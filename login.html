<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign in • Rydealot</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Google Identity Services (1-Tap & Button) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Facebook JavaScript SDK -->
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
<style>
  :root {
    --ink: #0F172A;
    --ink-soft: #64748B;
    --line: #E2E8F0;
    --bg-page: #F8FAFC;
    --card-bg: #FFFFFF;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-tint: #EFF6FF;
    --error: #EF4444;
    --error-bg: #FEF2F2;
    --success: #10B981;
    --success-bg: #ECFDF5;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg-page);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .auth-shell {
    width: 100%;
    max-width: 400px;
    background: var(--card-bg);
    border: 1.5px solid var(--line);
    border-radius: 24px;
    padding: 38px 28px 30px;
    box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
    position: relative;
    overflow: hidden;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand-logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 12px;
  }
  .brand-logo {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.18);
  }
  .brand-mascot {
    position: absolute;
    bottom: -6px;
    right: -16px;
    width: 34px;
    height: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }
  .brand-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .brand-subtitle {
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 500;
    line-height: 1.45;
  }

  /* Social Auth Stack */
  .social-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 8px;
  }
  .google-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .btn-facebook {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 16px;
    background: #1877F2;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(24, 119, 242, 0.25);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-facebook:hover { background: #166FE5; }
  .btn-facebook:active { transform: scale(0.99); }

  /* Status message banner */
  .status-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    animation: fadeIn 0.2s ease;
    text-align: center;
  }
  .status-box.error {
    background: var(--error-bg);
    color: var(--error);
    border: 1.5px solid #FECACA;
  }
  .status-box.success {
    background: var(--success-bg);
    color: var(--success);
    border: 1.5px solid #A7F3D0;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Trust & Security Notes */
  .trust-footer {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .trust-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    color: #10B981;
    background: #ECFDF5;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<!-- Hidden Google 1-Tap Initializer -->
<div id="g_id_onload"
     data-client_id="354179335584-5mtr4i9i53aie559el5tq38arevikacb.apps.googleusercontent.com"
     data-callback="handleGoogleResponse"
     data-auto_prompt="true">
</div>

<div class="auth-shell">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-logo-wrap">
      <img src="logo.png" alt="Rydealot" class="brand-logo">
      <img src="assets/mascot-waving.png" alt="Rydo" class="brand-mascot">
    </div>
    <h1 class="brand-title">Welcome to Rydealot</h1>
    <p class="brand-subtitle">Fast, zero-commission bike taxi & instant parcel network. Sign in with 1-Tap to continue.</p>
  </div>

  <!-- Social 1-Tap Stack -->
  <div class="social-stack">
    <!-- Google 1-Tap / Sign-In Button -->
    <div class="google-wrap">
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="continue_with"
           data-size="large"
           data-logo_alignment="left"
           data-width="344">
      </div>
    </div>

    <!-- Facebook Login Button -->
    <button type="button" class="btn-facebook" id="btn-facebook" onclick="loginWithFacebook()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      <span>Continue with Facebook</span>
    </button>
  </div>

  <!-- Status Alert Banner -->
  <div id="status-box" class="status-box" style="display:none;"></div>


</div>

<script>
/* =========================================================================
   RYDEALOT 1-TAP AUTH ENGINE
   ========================================================================= */
const SUPABASE_URL = "https://wupndimumeugfjxzejlj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1cG5kaW11bWV1Z2ZqeHplamxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDgwMDQsImV4cCI6MjA5NzY4NDAwNH0.dM6nG_cswzOAXuumW3LdfGJxxoF-Fn3iiVImUZ9as2Y";

const urlParams = new URLSearchParams(window.location.search);
const redirectTarget = urlParams.get('redirect') || 'index.html';

const statusBox = document.getElementById('status-box');

function showStatus(msg, isSuccess) {
  statusBox.textContent = msg;
  statusBox.className = 'status-box ' + (isSuccess ? 'success' : 'error');
  statusBox.style.display = 'flex';
}
function hideStatus() {
  statusBox.style.display = 'none';
}

// ── Sync User Record to Supabase ──
async function syncUserToDatabase(user) {
  try {
    const payload = {
      name: user.name || 'Rydealot Rider',
      vehicle_type: 'bike',
      vehicle_label: user.email ? ('User: ' + user.email) : 'Customer',
      plate: 'CUST-' + (user.id ? String(user.id).replace(/\D/g, '').slice(-4) || '1001' : '1001'),
      phone: user.phone || '9999988888',
      status: 'offline'
    };
    await fetch(`${SUPABASE_URL}/rest/v1/riders`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.warn("Supabase database sync note:", err);
  }
}

// ── Complete Login Session and Redirect ──
async function completeAuth(user) {
  showStatus(`Welcome, ${user.name}! Redirecting…`, true);
  
  // 1. Sync to Supabase in background
  syncUserToDatabase(user);

  // 2. Save active session
  const session = {
    id: user.id,
    name: user.name,
    email: user.email || '',
    phone: user.phone || '',
    avatar: user.avatar || '',
    role: 'customer',
    auth_provider: user.provider || 'google'
  };
  localStorage.setItem('rydealot_user_session', JSON.stringify(session));

  setTimeout(() => {
    window.location.href = redirectTarget;
  }, 800);
}

// ── 1. Google 1-Tap / Sign-In Handler ──
function parseJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) {
    return null;
  }
}

window.handleGoogleResponse = async function(response) {
  hideStatus();
  if (!response || !response.credential) {
    showStatus("Google sign-in failed. Please try again.", false);
    return;
  }
  const payload = parseJwt(response.credential);
  if (!payload || !payload.email) {
    showStatus("Could not read Google profile information.", false);
    return;
  }

  const user = {
    id: 'g_' + (payload.sub || Date.now()),
    name: payload.name || payload.email.split('@')[0],
    email: payload.email,
    avatar: payload.picture || '',
    provider: 'google'
  };
  await completeAuth(user);
};

// ── 2. Facebook SDK Login ──
window.fbAsyncInit = function () {
  FB.init({
    appId: '4530763897154260',
    cookie: true,
    xfbml: true,
    version: 'v20.0'
  });
};

function loginWithFacebook() {
  hideStatus();
  if (typeof FB === 'undefined') {
    showStatus("Facebook service is still loading. Please try in a moment.", false);
    return;
  }
  FB.login(function (response) {
    if (response.authResponse) {
      FB.api('/me', { fields: 'id,name,email,picture' }, async function(profile) {
        if (!profile || !profile.name) {
          showStatus("Could not fetch Facebook profile details.", false);
          return;
        }
        const user = {
          id: 'fb_' + profile.id,
          name: profile.name,
          email: profile.email || '',
          avatar: profile.picture?.data?.url || '',
          provider: 'facebook'
        };
        await completeAuth(user);
      });
    } else {
      showStatus("Facebook sign-in was cancelled.", false);
    }
  }, { scope: 'public_profile,email' });
}
</script>
</body>
</html>
