<style>
  :root {
    --ink: #0F172A;
    --ink-soft: #64748B;
    --line: #E2E8F0;
    --bg-page: #F8FAFC;
    --card-bg: #FFFFFF;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-tint: #EFF6FF;
    --error: #EF4444;
    --error-bg: #FEF2F2;
    --success: #10B981;
    --success-bg: #ECFDF5;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg-page);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .auth-shell {
    width: 100%;
    max-width: 400px;
    background: var(--card-bg);
    border: 1.5px solid var(--line);
    border-radius: 24px;
    padding: 38px 28px 30px;
    box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
    position: relative;
    overflow: hidden;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .brand-logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 12px;
  }
  .brand-logo {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.18);
  }
  .brand-mascot {
    position: absolute;
    bottom: -6px;
    right: -16px;
    width: 34px;
    height: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }
  .brand-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .brand-subtitle {
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 500;
    line-height: 1.45;
  }

  /* Social Auth Stack */
  .social-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 0;
  }
  .google-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .btn-facebook {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 16px;
    background: #1877F2;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(24, 119, 242, 0.25);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-facebook:hover { background: #166FE5; }
  .btn-facebook:active { transform: scale(0.99); }

  /* Divider */
  .auth-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 22px 0;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .auth-divider::before, .auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* Email/Password Form */
  .email-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .form-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-field label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .form-field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    color: var(--ink);
    background: var(--bg-page);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }
  .form-field input::placeholder {
    color: #94A3B8;
    font-weight: 400;
  }
  .field-username {
    display: none;
  }
  .field-username.show {
    display: flex;
  }

  .btn-submit {
    width: 100%;
    padding: 14px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    letter-spacing: -0.01em;
  }
  .btn-submit:hover { background: var(--accent-hover); }
  .btn-submit:active { transform: scale(0.99); }
  .btn-submit:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .auth-toggle {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .auth-toggle a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .auth-toggle a:hover { text-decoration: underline; }

  /* Status message banner */
  .status-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    animation: fadeIn 0.2s ease;
    text-align: center;
  }
  .status-box.error {
    background: var(--error-bg);
    color: var(--error);
    border: 1.5px solid #FECACA;
  }
  .status-box.success {
    background: var(--success-bg);
    color: var(--success);
    border: 1.5px solid #A7F3D0;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Username Step Modal Overlay */
  .username-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .username-overlay.active {
    display: flex;
  }
  .username-modal {
    width: 100%;
    max-width: 370px;
    background: #fff;
    border-radius: 24px;
    padding: 34px 28px 28px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
    animation: modalSlideUp 0.3s ease;
    text-align: center;
  }
  @keyframes modalSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .username-modal .modal-emoji {
    font-size: 40px;
    margin-bottom: 10px;
  }
  .username-modal h2 {
    font-family: 'Manrope', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .username-modal p {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 20px;
    line-height: 1.45;
  }
  .username-modal input {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    margin-bottom: 16px;
  }
  .username-modal input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }
  .username-modal .btn-continue {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .username-modal .btn-continue:hover { background: var(--accent-hover); }

  /* Trust & Security Notes */
  .trust-footer {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .trust-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    color: #10B981;
    background: #ECFDF5;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<!-- Hidden Google 1-Tap Initializer -->
<div id="g_id_onload"
     data-client_id="354179335584-5mtr4i9i53aie559el5tq38arevikacb.apps.googleusercontent.com"
     data-callback="handleGoogleResponse"

</div>

<!-- Username Step Modal (for new Google/Facebook users) -->
<div class="username-overlay" id="username-overlay">
  <div class="username-modal">

<div class="auth-shell">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-logo-wrap">

    <!-- Facebook Login Button -->
    <button type="button" class="btn-facebook" id="btn-facebook" onclick="loginWithFacebook()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      <span>Continue with Facebook</span>
    </button>
  </div>

  <!-- Divider -->
  <div class="auth-divider">or</div>

  <!-- Email/Password Form -->
  <form class="email-form" id="email-form" autocomplete="off">
    <div class="form-field">
      <label for="auth-email">📧 Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" required>

    <div class="form-field field-username" id="field-username">
      <label for="auth-username">👤 Username</label>
      <input type="text" id="auth-username" placeholder="What should we call you?" maxlength="40">

  <div class="auth-toggle" id="auth-toggle">

  <!-- Status Alert Banner -->
  <div id="status-box" class="status-box" style="display:none;"></div>
</div>

<script>
/* =========================================================================
   RYDEALOT UNIFIED AUTH ENGINE (Google + Facebook + Email/Password)
   ========================================================================= */
const SUPABASE_URL = "https://wupndimumeugfjxzejlj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1cG5kaW11bWV1Z2ZqeHplamxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDgwMDQsImV4cCI6MjA5NzY4NDAwNH0.dM6nG_cswzOAXuumW3LdfGJxxoF-Fn3iiVImUZ9as2Y";

const urlParams = new URLSearchParams(window.location.search);
const redirectTarget = urlParams.get('redirect') || 'index.html';

const statusBox = document.getElementById('status-box');
let isSignUpMode = false;

// ── Pending social user (waiting for username modal) ──
let pendingSocialUser = null;

function showStatus(msg, isSuccess) {
  statusBox.textContent = msg;
  statusBox.className = 'status-box ' + (isSuccess ? 'success' : 'error');
  statusBox.style.display = 'flex';
}
function hideStatus() {
  statusBox.style.display = 'none';
}

// ── SHA-256 Password Hashing (Web Crypto API — portable, no backend needed) ──
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ── Supabase REST helpers ──
async function sbFetch(endpoint, options) {
  const method = (options && options.method) || 'GET';
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  };
  if (options && options.prefer) headers['Prefer'] = options.prefer;
  const config = { method, headers };
  if (options && options.body) config.body = JSON.stringify(options.body);
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + endpoint, config);
  if (method === 'GET' || (options && options.prefer && options.prefer.includes('return=representation'))) {
    return res.json();
  }
  return res;
}

// ── Check if user exists by email ──
async function findUserByEmail(email) {
  try {
    const rows = await sbFetch('riders?email=eq.' + encodeURIComponent(email) + '&select=*&limit=1');
    if (Array.isArray(rows) && rows.length > 0) return rows[0];
  } catch (e) {
    console.warn('findUserByEmail error:', e);
  }
  return null;
}

// ── Sync user to Supabase (INSERT for new, PATCH for existing) ──
async function syncUserToDatabase(user) {
  try {
    const existing = await findUserByEmail(user.email);
    if (existing) {
      // Update existing user's name/avatar
      await sbFetch('riders?email=eq.' + encodeURIComponent(user.email), {
        method: 'PATCH',
        body: {
          name: user.name,
          avatar_url: user.avatar || null
        }
      });
    } else {
      // Insert new user
      const payload = {
        name: user.name || 'Rydealot Rider',
        email: user.email || '',
        vehicle_type: 'bike',
        vehicle_label: user.email ? ('User: ' + user.email) : 'Customer',
        plate: 'CUST-' + (user.id ? String(user.id).replace(/\D/g, '').slice(-4) || '1001' : '1001'),
        phone: user.phone || '9999988888',
        status: 'offline',
        auth_provider: user.provider || 'email'
      };
      if (user.password_hash) payload.password_hash = user.password_hash;
      await sbFetch('riders', {
        method: 'POST',
        prefer: 'return=minimal',
        body: payload
      });
    }
  } catch (err) {
    console.warn("Supabase sync note:", err);
  }
}

// ── Complete Login Session and Redirect ──
async function completeAuth(user) {
  showStatus('Welcome, ' + user.name + '! Redirecting…', true);

  // Sync to Supabase in background
  syncUserToDatabase(user);

  // Save active session
  const session = {
    id: user.id,
    name: user.name,
    email: user.email || '',
    phone: user.phone || '',
    avatar: user.avatar || '',
    role: 'customer',
    auth_provider: user.provider || 'email'
  };
  localStorage.setItem('rydealot_user_session', JSON.stringify(session));

  setTimeout(function() {
    window.location.href = redirectTarget;
  }, 800);
}

// ── Show Username Modal (for social auth new users) ──
function showUsernameModal(user) {
  pendingSocialUser = user;
  var overlay = document.getElementById('username-overlay');
  var input = document.getElementById('modal-username');
  input.value = user.name || '';
  overlay.classList.add('active');
  setTimeout(function() { input.focus(); input.select(); }, 200);
}

// ── Username Modal: Continue button ──
document.getElementById('btn-modal-continue').addEventListener('click', async function() {
  var input = document.getElementById('modal-username');
  var name = input.value.trim();
  if (!name) {
    input.style.borderColor = 'var(--error)';
    input.focus();
    return;
  }
  if (!pendingSocialUser) return;

  pendingSocialUser.name = name;
  document.getElementById('username-overlay').classList.remove('active');
  await completeAuth(pendingSocialUser);
  pendingSocialUser = null;
});

// Also allow Enter key in the modal
document.getElementById('modal-username').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('btn-modal-continue').click();
  }
});

// ── 1. Google 1-Tap / Sign-In Handler ──
function parseJwt(token) {
  try {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) {
    return null;
  }
}

window.handleGoogleResponse = async function(response) {
  hideStatus();
  if (!response || !response.credential) {
    showStatus("Google sign-in failed. Please try again.", false);
    return;
  }
  var payload = parseJwt(response.credential);
  if (!payload || !payload.email) {
    showStatus("Could not read Google profile information.", false);
    return;
  }

  var user = {
    id: 'g_' + (payload.sub || Date.now()),
    name: payload.name || payload.email.split('@')[0],
    email: payload.email,
    avatar: payload.picture || '',
    provider: 'google'
  };

  // Check if returning user
  var existing = await findUserByEmail(user.email);
  if (existing) {
    // Returning user — use their saved name, skip username modal
    user.name = existing.name || user.name;
    user.id = existing.id || user.id;
    await completeAuth(user);
  } else {
    // New user — show username modal
    showUsernameModal(user);
  }
};

// ── 2. Facebook SDK Login ──
window.fbAsyncInit = function () {
  FB.init({
    appId: '4530763897154260',
    cookie: true,
    xfbml: true,
    version: 'v20.0'
  });
};

function loginWithFacebook() {
  hideStatus();
  if (typeof FB === 'undefined') {
    showStatus("Facebook service is still loading. Please try in a moment.", false);
    return;
  }
  FB.login(function (response) {
    if (response.authResponse) {
      FB.api('/me', { fields: 'id,name,email,picture' }, async function(profile) {
        if (!profile || !profile.name) {
          showStatus("Could not fetch Facebook profile details.", false);
          return;
        }
        var user = {
          id: 'fb_' + profile.id,
          name: profile.name,
          email: profile.email || '',
          avatar: profile.picture?.data?.url || '',
          provider: 'facebook'
        };

        // Check if returning user
        if (user.email) {
          var existing = await findUserByEmail(user.email);
          if (existing) {
            user.name = existing.name || user.name;
            user.id = existing.id || user.id;
            await completeAuth(user);
            return;
          }
        }
        // New user — show username modal
        showUsernameModal(user);
      });
    } else {
      showStatus("Facebook sign-in was cancelled.", false);
    }
  }, { scope: 'public_profile,email' });
}

// ── 3. Email/Password Auth ──
var toggleLink = document.getElementById('toggle-mode');
var usernameField = document.getElementById('field-username');
var submitBtn = document.getElementById('btn-auth-submit');
var authTitle = document.getElementById('auth-title');
var authSubtitle = document.getElementById('auth-subtitle');
var toggleText = document.getElementById('auth-toggle');

function setMode(signUp) {
  isSignUpMode = signUp;
  if (signUp) {
    usernameField.classList.add('show');
    submitBtn.textContent = 'Create Account';
    authTitle.textContent = 'Create your account';
    authSubtitle.textContent = 'Join Rydealot — zero-commission rides, parcels & freight.';
    toggleText.innerHTML = 'Already have an account? <a id="toggle-mode">Sign In</a>';
  } else {
    usernameField.classList.remove('show');
    submitBtn.textContent = 'Sign In';
    authTitle.textContent = 'Welcome to Rydealot';
    authSubtitle.textContent = 'Fast, zero-commission bike taxi & instant parcel network.';
    toggleText.innerHTML = 'Don\'t have an account? <a id="toggle-mode">Sign Up</a>';
  }
  hideStatus();
  // Re-attach toggle listener
  document.getElementById('toggle-mode').addEventListener('click', function() {
    setMode(!isSignUpMode);
  });
}

toggleLink.addEventListener('click', function() {
  setMode(!isSignUpMode);
});

// Auto-fill username from email
document.getElementById('auth-email').addEventListener('input', function() {
  if (isSignUpMode) {
    var email = this.value.trim();
    var usernameInput = document.getElementById('auth-username');
    if (email.includes('@') && !usernameInput._userEdited) {
      usernameInput.value = email.split('@')[0];
    }
  }
});
document.getElementById('auth-username').addEventListener('input', function() {
  this._userEdited = true;
});

// Form submit
document.getElementById('email-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  hideStatus();

  var email = document.getElementById('auth-email').value.trim().toLowerCase();
  var password = document.getElementById('auth-password').value;
  var username = document.getElementById('auth-username').value.trim();

  if (!email || !password) {
    showStatus("Please fill in email and password.", false);
    return;
  }
  if (password.length < 6) {
    showStatus("Password must be at least 6 characters.", false);
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = isSignUpMode ? 'Creating account…' : 'Signing in…';

  try {
    var hash = await hashPassword(password);

    if (isSignUpMode) {
      // ── SIGN UP ──
      if (!username) {
        username = email.split('@')[0];
      }

      // Check if email already exists
      var existing = await findUserByEmail(email);
      if (existing) {
        showStatus("An account with this email already exists. Sign in instead.", false);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
        return;
      }

      var user = {
        id: 'e_' + Date.now(),
        name: username,
        email: email,
        avatar: '',
        provider: 'email',
        password_hash: hash
      };
      await completeAuth(user);

    } else {
      // ── SIGN IN ──
      var existing = await findUserByEmail(email);
      if (!existing) {
        showStatus("No account found with this email. Sign up first.", false);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        return;
      }

      // Check if this is a social-auth user (no password_hash)
      if (!existing.password_hash) {
        var provider = existing.auth_provider || 'Google/Facebook';
        showStatus("This account uses " + provider + " sign-in. Use the button above.", false);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        return;
      }

      // Verify password
      if (existing.password_hash !== hash) {
        showStatus("Incorrect password. Please try again.", false);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        return;
      }

      // Password matches — log in
      var user = {
        id: existing.id || ('e_' + Date.now()),
        name: existing.name || email.split('@')[0],
        email: email,
        avatar: existing.avatar_url || '',
        provider: 'email'
      };
      await completeAuth(user);
    }
  } catch (err) {
    console.error('Auth error:', err);
    showStatus("Something went wrong. Please try again.", false);
    submitBtn.disabled = false;
    submitBtn.textContent = isSignUpMode ? 'Create Account' : 'Sign In';
  }
});

// Check URL for ?mode=signup
if (urlParams.get('mode') === 'signup') {
  setMode(true);
}
</script>
