<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Offline • Rydealot</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --line: #E2E8F0;
    --ink: #0F172A;
    --ink-soft: #64748B;
    --amber: #FFB020;
    --amber-deep: #F59E0B;
    --green: #22C55E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  .offline-card {
    max-width: 390px;
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 28px;
    padding: 36px 26px;
    box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12), 0 0 24px rgba(255, 176, 32, 0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Mascot Animation Container */
  .mascot-container {
    width: 150px;
    height: 150px;
    position: relative;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Radar pulse waves */
  .pulse-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -65px;
    margin-left: -65px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2px dashed rgba(245, 158, 11, 0.5);
    animation: radarPulse 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    pointer-events: none;
  }
  .pulse-ring:nth-child(2) {
    animation-delay: 1.4s;
  }
  @keyframes radarPulse {
    0% { transform: scale(0.65); opacity: 0.95; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  /* Circular Mascot Portal - Crops video into a perfect radar sphere */
  .mascot-circle {
    width: 124px;
    height: 124px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    z-index: 2;
    border: 3.5px solid var(--amber);
    box-shadow: 0 0 24px rgba(255, 176, 32, 0.35);
    background: #0B132B;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mascot-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    display: block;
    pointer-events: none;
  }

  .offline-title {
    font-family: 'Manrope', sans-serif;
    font-size: 21px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }

  .offline-desc {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  /* Connection status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #FFFBEB;
    border: 1.5px solid #FDE68A;
    color: #B45309;
    font-size: 12px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 22px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #D97706;
    animation: blink 1.2s ease-in-out infinite alternate;
  }
  @keyframes blink {
    from { opacity: 0.3; }
    to { opacity: 1; }
  }

  .btn-retry {
    width: 100%;
    padding: 13.5px 20px;
    background: linear-gradient(135deg, #FFB020, #F59E0B);
    color: #0F172A;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s ease, background 0.15s ease;
    box-shadow: 0 4px 16px rgba(255, 176, 32, 0.35);
  }
  .btn-retry:hover { background: var(--amber-deep); transform: translateY(-1px); }
  .btn-retry:active { transform: translateY(0); }

  .auto-retry-text {
    font-size: 11.5px;
    color: #64748B;
    margin-top: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="offline-card">

  <!-- Mascot Stage with Circular Frame -->
  <div class="mascot-container">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="mascot-circle">
      <video autoplay loop muted playsinline webkit-playsinline class="mascot-media" id="offline-mascot-video" src="assets/video/mascot-offline.mp4">
        <img src="assets/mascot-offline.webp" class="mascot-media" alt="Rydo Searching For Signal">
      </video>
    </div>
  </div>

  <h2 class="offline-title">No Internet Connection</h2>
  <p class="offline-desc">
    Rydo is searching for a signal! Please check your mobile data or Wi-Fi connection.
  </p>

  <div class="status-pill" id="status-pill">
    <span class="status-dot"></span>
    <span id="status-text">Signal Disconnected</span>
  </div>

  <button type="button" class="btn-retry" onclick="checkConnection()">
    🔄 Try Reconnecting Now
  </button>

  <div class="auto-retry-text" id="auto-retry-text">
    Auto-detecting connection in background…
  </div>

</div>

<script>
  var vid = document.getElementById('offline-mascot-video');
  if (vid) {
    vid.muted = true;
    vid.playsInline = true;
    if (!vid._errBound) {
      vid._errBound = true;
      vid.addEventListener('error', function() {
        var img = document.createElement('img');
        img.src = 'assets/mascot-offline.webp';
        img.className = 'mascot-media';
        img.alt = 'Rydo Searching For Signal';
        if (vid.parentNode) vid.parentNode.replaceChild(img, vid);
      });
    }
    var p = vid.play();
    if (p !== undefined) {
      p.catch(function() {
        var img = document.createElement('img');
        img.src = 'assets/mascot-offline.webp';
        img.className = 'mascot-media';
        img.alt = 'Rydo Searching For Signal';
        if (vid.parentNode) vid.parentNode.replaceChild(img, vid);
      });
    }
  }

  var isChecking = false;
  function checkConnection() {
    var pill = document.getElementById('status-pill');
    var text = document.getElementById('status-text');
    var dot = document.querySelector('.status-dot');
    text.textContent = 'Checking network…';

    if (isChecking) return;
    isChecking = true;

    // Active ping test
    fetch('./icon.svg?rd_probe=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function(res) {
        isChecking = false;
        if (res && res.ok) {
          text.textContent = '🟢 Connected! Loading Rydealot…';
          pill.style.background = 'rgba(34, 197, 94, 0.15)';
          pill.style.borderColor = 'rgba(34, 197, 94, 0.3)';
          pill.style.color = '#22C55E';
          if (dot) dot.style.background = '#22C55E';
          setTimeout(function() {
            window.location.href = './index.html';
          }, 350);
        } else {
          throw new Error('Offline');
        }
      })
      .catch(function() {
        isChecking = false;
        text.textContent = 'Still Offline • Check Wi-Fi / Data';
        pill.style.background = '#FFFBEB';
        pill.style.borderColor = '#FDE68A';
        pill.style.color = '#B45309';
        if (dot) dot.style.background = '#D97706';
      });
  }

  // Auto-resume app the moment internet is restored
  window.addEventListener('online', function() {
    checkConnection();
  });

  // Periodic heartbeat retry every 4 seconds
  setInterval(function() {
    if (navigator.onLine) {
      checkConnection();
    }
  }, 4000);
</script>
</body>
</html>
