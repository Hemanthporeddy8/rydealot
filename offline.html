<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Offline • Rydealot</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F19;
    --card: #131B2E;
    --line: #1E293B;
    --ink: #FFFFFF;
    --ink-soft: #94A3B8;
    --accent: #3B82F6;
    --green: #22C55E;
    --amber: #F59E0B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  .offline-card {
    max-width: 400px;
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 28px;
    padding: 36px 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Mascot Animation Container */
  .mascot-container {
    width: 170px;
    height: 190px;
    position: relative;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Radar pulse waves */
  .pulse-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -70px;
    margin-left: -70px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 2px dashed rgba(245, 158, 11, 0.4);
    animation: radarPulse 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  }
  .pulse-ring:nth-child(2) {
    animation-delay: 1.4s;
  }
  @keyframes radarPulse {
    0% { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .mascot-img {
    width: 135px;
    height: auto;
    max-height: 180px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.55));
    animation: mascotBob 3.5s ease-in-out infinite;
  }
  @keyframes mascotBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .offline-title {
    font-family: 'Manrope', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }

  .offline-desc {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }

  /* Connection status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: var(--amber);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 99px;
    margin-bottom: 24px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    animation: blink 1.2s ease-in-out infinite alternate;
  }
  @keyframes blink {
    from { opacity: 0.3; }
    to { opacity: 1; }
  }

  .btn-retry {
    width: 100%;
    padding: 14px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
  }
  .btn-retry:hover { background: #2563EB; transform: translateY(-1px); }
  .btn-retry:active { transform: translateY(0); }

  .auto-retry-text {
    font-size: 11.5px;
    color: #64748B;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="offline-card">

  <!-- Mascot Stage -->
  <div class="mascot-container">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <img src="assets/mascot-offline.png" class="mascot-img" alt="Rydo Searching For Signal">
  </div>

  <h2 class="offline-title">No Internet Connection</h2>
  <p class="offline-desc">
    Rydo is searching for a signal! Please check your mobile data or Wi-Fi connection.
  </p>

  <div class="status-pill" id="status-pill">
    <span class="status-dot"></span>
    <span id="status-text">Signal Disconnected</span>
  </div>

  <button type="button" class="btn-retry" onclick="checkConnection()">
    🔄 Try Reconnecting Now
  </button>

  <div class="auto-retry-text" id="auto-retry-text">
    Auto-detecting connection in background…
  </div>

</div>

<script>
  function checkConnection() {
    var pill = document.getElementById('status-pill');
    var text = document.getElementById('status-text');
    text.textContent = 'Checking network…';

    if (navigator.onLine) {
      text.textContent = 'Connected! Reloading…';
      pill.style.background = 'rgba(34, 197, 94, 0.15)';
      pill.style.borderColor = 'rgba(34, 197, 94, 0.3)';
      pill.style.color = '#22C55E';
      document.querySelector('.status-dot').style.background = '#22C55E';
      setTimeout(function() {
        window.location.reload();
      }, 400);
    } else {
      setTimeout(function() {
        text.textContent = 'Still Offline • Check Wi-Fi';
      }, 500);
    }
  }

  // Auto-resume app the moment internet is restored
  window.addEventListener('online', function() {
    checkConnection();
  });

  // Periodic heartbeat retry every 4 seconds
  setInterval(function() {
    if (navigator.onLine) {
      window.location.reload();
    }
  }, 4000);
</script>
</body>
</html>
