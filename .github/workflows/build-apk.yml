name: Build Native Android APK & Google Play AAB

on:
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions dashboard
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 🚀 Compile Native Release APK, Debug APK & Google Play AAB
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace

      - name: 📲 Update root rydealot.apk for Website 1-Click Download
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk rydealot.apk
            echo "Copied release APK to rydealot.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk rydealot.apk
            echo "Copied debug APK to rydealot.apk"
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Bot]"
          git add rydealot.apk
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): auto-update rydealot.apk with native build [skip ci]"
            git push origin main
          fi

      - name: 📤 Upload Release APK (Direct Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: Rydealot-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload Debug APK (Developer Testing)
        uses: actions/upload-artifact@v4
        with:
          name: Rydealot-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload Google Play Bundle (.aab for Play Store Upload)
        uses: actions/upload-artifact@v4
        with:
          name: Rydealot-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 🏷️ Attach APK & AAB to GitHub Release (If Tagged)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
