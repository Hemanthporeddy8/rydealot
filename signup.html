<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign up • Rydealot</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Google Identity Services (1-Tap & Button) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Facebook JavaScript SDK -->
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
<style>
  :root {
    --ink: #0F172A;
    --ink-soft: #64748B;
    --line: #E2E8F0;
    --bg-page: #F8FAFC;
    --card-bg: #FFFFFF;
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    --accent-tint: #EFF6FF;
    --error: #EF4444;
    --error-bg: #FEF2F2;
    --success: #10B981;
    --success-bg: #ECFDF5;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg-page);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .auth-shell {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1.5px solid var(--line);
    border-radius: 24px;
    padding: 36px 28px;
    box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
    position: relative;
    overflow: hidden;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand-logo-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 12px;
  }
  .brand-logo {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.18);
  }
  .brand-mascot {
    position: absolute;
    bottom: -6px;
    right: -16px;
    width: 32px;
    height: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }
  .brand-title {
    font-family: 'Manrope', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .brand-subtitle {
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 500;
    line-height: 1.45;
  }

  /* Social Auth Stack */
  .social-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .google-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .btn-facebook {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    background: #1877F2;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(24, 119, 242, 0.25);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn-facebook:hover { background: #166FE5; }
  .btn-facebook:active { transform: scale(0.99); }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .divider-text {
    font-size: 11px;
    font-weight: 800;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Form Fields */
  .form-group {
    margin-bottom: 16px;
  }
  .form-label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .form-input-wrap {
    position: relative;
  }
  .form-input {
    width: 100%;
    padding: 13px 14px;
    background: #F8FAFC;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    font-size: 14.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .form-input:focus {
    border-color: var(--accent);
    background: #FFFFFF;
  }
  .form-input::placeholder {
    color: #94A3B8;
    font-weight: 400;
  }

  /* Primary Button */
  .btn-primary {
    width: 100%;
    padding: 14px 16px;
    background: var(--ink);
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 800;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s ease, transform 0.1s ease;
    margin-top: 20px;
  }
  .btn-primary:hover { background: #1E293B; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled {
    background: #CBD5E1;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* Status message banner */
  .status-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.2s ease;
  }
  .status-box.error {
    background: var(--error-bg);
    color: var(--error);
    border: 1.5px solid #FECACA;
  }
  .status-box.success {
    background: var(--success-bg);
    color: var(--success);
    border: 1.5px solid #A7F3D0;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Footer Switcher */
  .auth-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .auth-footer a {
    color: var(--accent);
    font-weight: 800;
    text-decoration: none;
  }
  .auth-footer a:hover {
    text-decoration: underline;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Hidden Google 1-Tap Initializer -->
<div id="g_id_onload"
     data-client_id="354179335584-5mtr4i9i53aie559el5tq38arevikacb.apps.googleusercontent.com"
     data-callback="handleGoogleResponse"
     data-auto_prompt="true">
</div>

<div class="auth-shell">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-logo-wrap">
      <img src="logo.png" alt="Rydealot" class="brand-logo">
      <img src="assets/mascot-waving.png" alt="Rydo" class="brand-mascot">
    </div>
    <h1 class="brand-title">Create an account</h1>
    <p class="brand-subtitle">Join Rydealot for fast, zero-commission bike taxis and instant parcel delivery</p>
  </div>

  <!-- Social 1-Tap Stack -->
  <div class="social-stack">
    <!-- Google 1-Tap / Sign-In Button -->
    <div class="google-wrap">
      <div class="g_id_signin"
           data-type="standard"
           data-shape="rectangular"
           data-theme="outline"
           data-text="signup_with"
           data-size="large"
           data-logo_alignment="left"
           data-width="360">
      </div>
    </div>

    <!-- Facebook Login Button -->
    <button type="button" class="btn-facebook" id="btn-facebook" onclick="loginWithFacebook()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      <span>Sign up with Facebook</span>
    </button>
  </div>

  <!-- Divider -->
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or create with email</span>
    <div class="divider-line"></div>
  </div>

  <!-- Registration Form -->
  <form id="signup-form" onsubmit="handleEmailSignup(event)">
    <div class="form-group">
      <label class="form-label" for="name-input">Full name</label>
      <div class="form-input-wrap">
        <input type="text" id="name-input" class="form-input" placeholder="e.g. Rahul Sharma" required autocomplete="name">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="email-input">Email address</label>
      <div class="form-input-wrap">
        <input type="email" id="email-input" class="form-input" placeholder="you@example.com" required autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password-input">Create password</label>
      <div class="form-input-wrap">
        <input type="password" id="password-input" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
      </div>
    </div>

    <button type="submit" class="btn-primary" id="btn-submit">
      <span id="btn-submit-text">Create Account &rarr;</span>
      <span id="btn-submit-spinner" class="spinner" style="display:none;"></span>
    </button>

    <div id="status-box" class="status-box" style="display:none;"></div>
  </form>

  <!-- Footer Link to Login -->
  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in here</a>
  </div>
</div>

<script>
/* =========================================================================
   RYDEALOT AUTH ENGINE: SIGNUP
   ========================================================================= */
const SUPABASE_URL = "https://wupndimumeugfjxzejlj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1cG5kaW11bWV1Z2ZqeHplamxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMDgwMDQsImV4cCI6MjA5NzY4NDAwNH0.dM6nG_cswzOAXuumW3LdfGJxxoF-Fn3iiVImUZ9as2Y";

const urlParams = new URLSearchParams(window.location.search);
const redirectTarget = urlParams.get('redirect') || 'index.html';

const statusBox = document.getElementById('status-box');
const submitBtn = document.getElementById('btn-submit');
const submitBtnText = document.getElementById('btn-submit-text');
const submitBtnSpinner = document.getElementById('btn-submit-spinner');

function showStatus(msg, isSuccess) {
  statusBox.textContent = msg;
  statusBox.className = 'status-box ' + (isSuccess ? 'success' : 'error');
  statusBox.style.display = 'flex';
}
function hideStatus() {
  statusBox.style.display = 'none';
}

function setButtonLoading(loading) {
  submitBtn.disabled = loading;
  submitBtnText.style.display = loading ? 'none' : 'inline';
  submitBtnSpinner.style.display = loading ? 'inline-block' : 'none';
}

// ── Sync User Record to Supabase ──
async function syncUserToDatabase(user) {
  try {
    const payload = {
      name: user.name || 'Rydealot Rider',
      vehicle_type: 'bike',
      vehicle_label: user.email ? ('User: ' + user.email) : 'Customer',
      plate: 'CUST-' + (user.id ? String(user.id).replace(/\D/g, '').slice(-4) || '1001' : '1001'),
      phone: user.phone || '9999988888',
      status: 'offline'
    };
    await fetch(`${SUPABASE_URL}/rest/v1/riders`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.warn("Supabase database sync note:", err);
  }
}

// ── Complete Login Session and Redirect ──
async function completeAuth(user) {
  showStatus(`Account created! Welcome, ${user.name}! Redirecting…`, true);
  
  // 1. Sync to Supabase in background
  syncUserToDatabase(user);

  // 2. Save active session
  const session = {
    id: user.id,
    name: user.name,
    email: user.email || '',
    phone: user.phone || '',
    avatar: user.avatar || '',
    role: 'customer',
    auth_provider: user.provider || 'email'
  };
  localStorage.setItem('rydealot_user_session', JSON.stringify(session));

  setTimeout(() => {
    window.location.href = redirectTarget;
  }, 900);
}

// ── 1. Google 1-Tap / Sign-In Handler ──
function parseJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) {
    return null;
  }
}

window.handleGoogleResponse = async function(response) {
  hideStatus();
  if (!response || !response.credential) {
    showStatus("Google sign-in failed. Please try again.", false);
    return;
  }
  const payload = parseJwt(response.credential);
  if (!payload || !payload.email) {
    showStatus("Could not read Google profile information.", false);
    return;
  }

  const user = {
    id: 'g_' + (payload.sub || Date.now()),
    name: payload.name || payload.email.split('@')[0],
    email: payload.email,
    avatar: payload.picture || '',
    provider: 'google'
  };

  // Save to registered users list
  let users = [];
  try {
    const stored = localStorage.getItem('rydealot_registered_users');
    if (stored) users = JSON.parse(stored);
  } catch(e) {}
  if (!users.some(u => u.email === user.email)) {
    users.push(user);
    localStorage.setItem('rydealot_registered_users', JSON.stringify(users));
  }

  await completeAuth(user);
};

// ── 2. Facebook SDK Login ──
window.fbAsyncInit = function () {
  FB.init({
    appId: '4530763897154260',
    cookie: true,
    xfbml: true,
    version: 'v20.0'
  });
};

function loginWithFacebook() {
  hideStatus();
  if (typeof FB === 'undefined') {
    showStatus("Facebook service is still loading. Please try in a moment.", false);
    return;
  }
  FB.login(function (response) {
    if (response.authResponse) {
      FB.api('/me', { fields: 'id,name,email,picture' }, async function(profile) {
        if (!profile || !profile.name) {
          showStatus("Could not fetch Facebook profile details.", false);
          return;
        }
        const user = {
          id: 'fb_' + profile.id,
          name: profile.name,
          email: profile.email || '',
          avatar: profile.picture?.data?.url || '',
          provider: 'facebook'
        };

        // Save to registered users list
        let users = [];
        try {
          const stored = localStorage.getItem('rydealot_registered_users');
          if (stored) users = JSON.parse(stored);
        } catch(e) {}
        if (!users.some(u => u.email === user.email)) {
          users.push(user);
          localStorage.setItem('rydealot_registered_users', JSON.stringify(users));
        }

        await completeAuth(user);
      });
    } else {
      showStatus("Facebook sign-up was cancelled.", false);
    }
  }, { scope: 'public_profile,email' });
}

// ── 3. Email & Password Registration ──
async function handleEmailSignup(event) {
  event.preventDefault();
  hideStatus();

  const name = document.getElementById('name-input').value.trim();
  const email = document.getElementById('email-input').value.trim().toLowerCase();
  const password = document.getElementById('password-input').value;

  if (!name) {
    showStatus("Please enter your full name.", false);
    return;
  }
  if (!email) {
    showStatus("Please enter your email address.", false);
    return;
  }
  if (!password || password.length < 6) {
    showStatus("Password must be at least 6 characters.", false);
    return;
  }

  setButtonLoading(true);

  try {
    let users = [];
    try {
      const stored = localStorage.getItem('rydealot_registered_users');
      if (stored) users = JSON.parse(stored);
    } catch(e) {}

    const existingUser = users.find(u => u.email === email);
    if (existingUser) {
      showStatus("An account with this email already exists. Redirecting to login…", false);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
      return;
    }

    const newUser = {
      id: 'usr_' + Date.now(),
      name: name,
      email: email,
      password: password,
      provider: 'email'
    };

    users.push(newUser);
    localStorage.setItem('rydealot_registered_users', JSON.stringify(users));

    await completeAuth(newUser);
  } catch (err) {
    showStatus(err.message || "Registration failed. Please try again.", false);
    setButtonLoading(false);
  }
}
</script>
</body>
</html>
